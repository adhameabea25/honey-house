services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: honeyhouse-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "HoneyDev#2026"
    ports:
      - "1433:1433"
    volumes:
      - honeyhouse-sql-data:/var/opt/mssql

volumes:
  honeyhouse-sql-data:
